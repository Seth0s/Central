name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: frontend (types, tests, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # tsconfig includes the test files, so this checks the suites too.
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build

  core:
    name: crates/core (tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/core
      # The domain crate is deliberately free of GTK/WebKit, so it needs no
      # system libraries (docs/architecture.md § Arquitetura).
      - run: cargo test --manifest-path crates/core/Cargo.toml

  tauri:
    name: src-tauri (tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux webview dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            build-essential \
            pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # The pure decision functions (layout, snapshot clock, focus transition,
      # backend override) are unit-tested here; the GTK calls around them are not
      # reachable without a display, so this compiles everything and runs those.
      - run: cargo test --manifest-path src-tauri/Cargo.toml
