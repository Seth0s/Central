# Tag-driven multi-platform release.
# Push a tag matching v* (e.g. v0.1.0) after bumping version in
# package.json + src-tauri/tauri.conf.json + src-tauri/Cargo.toml.
#
# Repo setting required: Settings → Actions → General → Workflow permissions
# → "Read and write permissions" (otherwise release upload fails with
# "Resource not accessible by integration").
#
# Linux artefacts: .deb, .rpm, .AppImage (ubuntu-22.04 for older glibc).
# macOS: unsigned .app/.dmg unless Apple signing secrets are configured.
# Windows: .msi + NSIS .exe.

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.release.outputs.release_id }}
    steps:
      - name: Get or create draft release
        id: release
        uses: actions/github-script@v7
        with:
          script: |
            const tag = context.ref.replace('refs/tags/', '');
            const { owner, repo } = context.repo;
            const body = [
              'Artefactos desta tag:',
              '- **Windows** — `.msi` / NSIS `.exe`',
              '- **macOS** — `.dmg` / `.app` (Apple Silicon + Intel)',
              '- **Linux** — `.rpm` (Fedora/RHEL/openSUSE), `.deb` (Debian/Ubuntu), `.AppImage`',
            ].join('\n');
            try {
              const { data } = await github.rest.repos.getReleaseByTag({ owner, repo, tag });
              core.setOutput('release_id', String(data.id));
              return;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            const { data } = await github.rest.repos.createRelease({
              owner,
              repo,
              tag_name: tag,
              name: `CentralByte ${tag}`,
              body,
              draft: true,
              prerelease: false,
            });
            core.setOutput('release_id', String(data.id));

  publish:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: --bundles deb,rpm,appimage
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libvte-2.91-dev \
            build-essential \
            pkg-config \
            patchelf \
            file \
            xdg-utils \
            rpm

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - run: npm ci

      - name: Build and upload release assets
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          releaseName: CentralByte ${{ github.ref_name }}
          releaseBody: |
            Artefactos desta tag:
            - **Windows** — `.msi` / NSIS `.exe`
            - **macOS** — `.dmg` / `.app` (Apple Silicon + Intel)
            - **Linux** — `.rpm` (Fedora/RHEL/openSUSE), `.deb` (Debian/Ubuntu), `.AppImage`
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
